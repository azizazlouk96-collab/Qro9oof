<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألعابي</title>
<style>
:root{--bg:#f6f1e7;--ink:#1d2433;--card:#fff;--line:#ddd3bf;--a1:#8a1218;--a2:#e8742a;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#12141a;--ink:#ece7da;--card:#1c1f28;--line:#2c3040;--a1:#e8574f;--a2:#f08a4b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.9}
#home{padding:28px 18px 40px;max-width:620px;margin:0 auto}
h1{font-size:32px;margin:0 0 4px}
.sub{opacity:.75;margin:0 0 26px}
.card{display:block;width:100%;text-align:start;font:inherit;background:var(--card);color:inherit;border:2px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:16px;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--a2);outline:none}
.card h2{margin:0 0 4px;font-size:22px}
.h h2{color:var(--a1)}.f h2{color:var(--a2)}
.card p{margin:0 0 10px;opacity:.85}
.card span{font-weight:700}
.lnk{display:block;margin:30px auto 0;background:none;border:0;color:inherit;font:inherit;font-size:14px;opacity:.75;text-decoration:underline;cursor:pointer}
#view{display:none;position:fixed;inset:0;flex-direction:column;background:#000}
#bar{height:46px;flex:none;display:flex;align-items:center;padding:0 12px;background:#14161c;padding-top:env(safe-area-inset-top,0px)}
#bar button{font:inherit;font-size:16px;color:#ece7da;background:none;border:1px solid #555;border-radius:8px;padding:4px 14px;cursor:pointer}
iframe{flex:1;width:100%;border:0;background:#000}
</style>
</head>
<body>
<main id="home">
<h1>ألعابي 🎮</h1>
<p class="sub">ألعاب ويب مجانية تعمل على الجوال والكمبيوتر.</p>
<button class="card h" data-g="h"><h2>👻 ممر الصمت</h2><p>لعبة رعب في متاهة مظلمة. اجمع المفاتيح واهرب قبل أن يمسك بك الشبح.</p><span>العب الآن ←</span></button>
<button class="card f" data-g="f"><h2>🦊 مغامرة الثعلب</h2><p>لعبة منصّات ملوّنة. اقفز فوق الفجوات، واجمع العملات، واهزم الخنافس.</p><span>العب الآن ←</span></button>
<button class="lnk" data-g="p">سياسة الخصوصية</button>
</main>
<div id="view"><div id="bar"><button id="back">→ الرئيسية</button></div><iframe id="fr" title="لعبة"></iframe></div>
<script>
const G={"h": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>ممر الصمت<\/title>\n<style>\n:root{--bg:#050506;--bone:#cfc8b0;--blood:#8a1218;--mold:#1d2a24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml,body{height:100%;margin:0;background:var(--bg);color:var(--bone);font-family:\"Aref Ruqaa\",Georgia,serif;overflow:hidden;touch-action:none;user-select:none}\nbody{display:flex;flex-direction:column;align-items:center;justify-content:center}\n#hud{height:44px;display:flex;gap:28px;align-items:center;font-size:20px}\n#hud b{color:var(--blood);font-weight:700}\ncanvas{display:block;background:#000}\n#ov{position:fixed;inset:0;background:rgba(5,5,6,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}\n#ov h1{font-size:52px;margin:0;color:var(--blood);text-shadow:0 0 24px #4a0a0e}\n#ov p{max-width:320px;line-height:1.9;font-size:19px;margin:0}\nbutton{font:inherit;font-size:22px;color:var(--bone);background:transparent;border:2px solid var(--blood);padding:10px 34px;border-radius:2px;cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--bone)}\n#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));font-size:19px;opacity:0;transition:opacity .4s}\n#flash{position:fixed;inset:0;background:var(--blood);opacity:0;pointer-events:none}\n<\/style>\n<\/head>\n<body>\n<div id=\"hud\"><span>المفاتيح: <b id=\"k\">0/3<\/b><\/span><span id=\"msg\"><\/span><\/div>\n<canvas id=\"c\"><\/canvas>\n<div id=\"toast\"><\/div>\n<div id=\"flash\"><\/div>\n<div id=\"ov\">\n  <h1>ممر الصمت<\/h1>\n  <p>استيقظتَ داخل مبنى مهجور. اجمع ثلاثة مفاتيح، ثم اهرب من الباب الأحمر في الزاوية. شيء ما يسير في العتمة، وكلما أخذتَ مفتاحًا ازداد سرعةً.<\/p>\n  <p style=\"font-size:16px;opacity:.7\">اسحب بإصبعك للحركة، أو استخدم الأسهم / WASD<\/p>\n  <button id=\"go\">ادخل<\/button>\n<\/div>\n<script>\nconst N=15,cv=document.getElementById('c'),cx=cv.getContext('2d');\nconst $=id=>document.getElementById(id);\nlet T,g,p,gh,keys,got,alive,run,t0,last,joy=null,held={},aud,beatT=0,shake=0,seed=0;\n\nfunction size(){const s=Math.floor(Math.min(innerWidth,innerHeight-90));cv.width=cv.height=s;T=s/N}\naddEventListener('resize',size);size();\n\nfunction maze(){\n  g=Array.from({length:N},()=>Array(N).fill(1));\n  const st=[[1,1]];g[1][1]=0;\n  while(st.length){\n    const [x,y]=st[st.length-1];\n    const nb=[[2,0],[-2,0],[0,2],[0,-2]].filter(([a,b])=>{const X=x+a,Y=y+b;return X>0&&Y>0&&X<N-1&&Y<N-1&&g[Y][X]});\n    if(!nb.length){st.pop();continue}\n    const [a,b]=nb[Math.random()*nb.length|0];\n    g[y+b/2][x+a/2]=0;g[y+b][x+a]=0;st.push([x+a,y+b]);\n  }\n  // open a few extra loops so the chase is escapable\n  for(let i=0;i<14;i++){const x=1+(Math.random()*(N-2)|0),y=1+(Math.random()*(N-2)|0);if(x%2!==y%2)g[y][x]=0}\n}\nfunction start(){\n  maze();\n  p={x:1.5,y:1.5};gh={x:7.5,y:7.5};\n  keys=[];\n  while(keys.length<3){\n    const x=1+2*(Math.random()*7|0),y=1+2*(Math.random()*7|0);\n    if(x+y>9&&!(x===13&&y===13)&&!keys.some(k=>k.x===x+.5&&k.y===y+.5))keys.push({x:x+.5,y:y+.5});\n  }\n  got=0;alive=true;run=true;t0=performance.now();last=t0;$('k').textContent='0/3';$('ov').style.display='none';\n  if(!aud){try{aud=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}\n  requestAnimationFrame(loop);\n}\nfunction solid(x,y){return g[Math.floor(y)]?.[Math.floor(x)]!==0}\nfunction bfs(sx,sy,tx,ty){\n  const q=[[sx,sy]],prev={};prev[sy*N+sx]=-1;\n  while(q.length){\n    const [x,y]=q.shift();\n    if(x===tx&&y===ty)break;\n    for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){\n      const X=x+a,Y=y+b;\n      if(g[Y]?.[X]===0&&!(Y*N+X in prev)){prev[Y*N+X]=y*N+x;q.push([X,Y])}\n    }\n  }\n  let c=ty*N+tx;if(!(c in prev))return null;\n  while(prev[c]!==-1&&prev[prev[c] or(let i=0;i<w;i++)coins.push({x:(x+i)*T+12,y:(y-1)*T+12,got:0})});\n  gaps.forEach(([a,b])=>{for(let i=0;i<=b-a;i++)coins.push({x:(a+i)*T+12,y:(8.2-Math.sin(i/(b-a)*Math.PI)*1.2)*T,got:0})});\n  en=[12,26,33,48,55,70,76].map(x=>({x:x*T,y:10*T-14,w:16,h:14,d:-1,dead:0}));\n}\nfunction reset(){p={x:2*T,y:8*T,w:14,h:20,vx:0,vy:0,g:0,f:1,inv:0};cam=0}\nfunction newGame(){build();reset();score=0;lives=3;run=true;$('sc').textContent=0;$('lv').textContent='❤ 3';$('ov').style.display='none';if(!aud)try{aud=new(window.AudioContext||window.webkitAudioContext)()}catch(e){};requestAnimationFrame(loop)}\nfunction tile(x,y){if(x<0||x>=W)return 1;if(y<0||y>=H)return 0;return t[y][x]}\nfunction hit(x,y,w,h){for(let yy=Math.floor(y/T);yy<=Math.floor((y+h-.01)/T);yy++)for(let xx=Math.floor(x/T);xx<=Math.floor((x+w-.01)/T);xx++)if(tile(xx,yy))return 1;return 0}\nfunction beep(f,d,ty){if(!aud)return;const o=aud.createOscillator(),g=aud.createGain(),n=aud.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.6,n+d);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(aud.destination);o.start(n);o.stop(n+d)}\nfunction die(){\n  lives--;$('lv').textContent='❤ '+lives;beep(160,.4,'sawtooth');\n  if(lives<=0){run=false;over('انتهت المحاولات','جمعتَ '+score+' عملة. جرّب مرة أخرى!','حاول مجددًا')}else reset();\n}\nfunction over(h,m,b){$('ov').style.display='flex';$('ov').querySelector('h1').textContent=h;$('ov').querySelector('p').textContent=m;$('go').textContent=b}\nfunction loop(){\n  if(!run)return;\n  const L=held.ArrowLeft||held.a||held.bl,R=held.ArrowRight||held.d||held.br,J=held.ArrowUp||held.w||held[' ']||held.bj;\n  p.vx=(R?1:0)*2.6-(L?1:0)*2.6;if(p.vx)p.f=p.vx>0?1:-1;\n  if(J&&p.g){p.vy=-9.6;p.g=0;beep(300,.15)}\n  if(!J&&p.vy<-3)p.vy=-3;\n  p.vy=Math.min(p.vy+.5,10);\n  p.x+=p.vx;\n  if(hit(p.x,p.y,p.w,p.h)){p.x=p.vx>0?Math.floor((p.x+p.w)/T)*T-p.w-.01:(Math.floor(p.x/T)+1)*T+.01}\n حركة، أو استخدم الأسهم / WASD<\/p>\n  <button id=\"go\">ادخل<\/button>\n<\/div>\n<script>\nconst N=15,cv=document.getElementById('c'),cx=cv.getContext('2d');\nconst $=id=>document.getElementById(id);\nlet T,g,p,gh,keys,got,alive,run,t0,last,joy=null,held={},aud,beatT=0,shake=0,seed=0;\n\nfunction size(){const s=Math.floor(Math.min(innerWidth,innerHeight-90));cv.width=cv.height=s;T=s/N}\naddEventListener('resize',size);size();\n\nfunction maze(){\n  g=Array.from({length:N},()=>Array(N).fill(1));\n  const st=[[1,1]];g[1][1]=0;\n  while(st.length){\n    const [x,y]=st[st.length-1];\n    const nb=[[2,0],[-2,0],[0,2],[0,-2]].filter(([a,b])=>{const X=x+a,Y=y+b;return X>0&&Y>0&&X<N-1&&Y<N-1&&g[Y][X]});\n    if(!nb.length){st.pop();continue}\n    const [a,b]=nb[Math.random()*nb.length|0];\n    g[y+b/2][x+a/2]=0;g[y+b][x+a]=0;st.push([x+a,y+b]);\n  }\n  // open a few extra loops so the chase is escapable\n  for(let i=0;i<14;i++){const x=1+(Math.random()*(N-2)|0),y=1+(Math.random()*(N-2)|0);if(x%2!==y%2)g[y][x]=0}\n}\nfunction start(){\n  maze();\n  p={x:1.5,y:1.5};gh={x:7.5,y:7.5};\n  keys=[];\n  while(keys.length<3){\n    const x=1+2*(Math.random()*7|0),y=1+2*(Math.random()*7|0);\n    if(x+y>9&&!(x===13&&y===13)&&!keys.some(k=>k.x===x+.5&&k.y===y+.5))keys.push({x:x+.5,y:y+.5});\n  }\n  got=0;alive=true;run=true;t0=performance.now();last=t0;$('k').textContent='0/3';$('ov').style.display='none';\n  if(!aud){try{aud=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}\n  requestAnimationFrame(loop);\n}\nfunction solid(x,y){return g[Math.floor(y)]?.[Math.floor(x)]!==0}\nfunction bfs(sx,sy,tx,ty){\n  const q=[[sx,sy]],prev={};prev[sy*N+sx]=-1;\n  while(q.length){\n    const [x,y]=q.shift();\n    if(x===tx&&y===ty)break;\n    for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){\n      const X=x+a,Y=y+b;\n      if(g[Y]?.[X]===0&&!(Y*N+X in prev)){prev[Y*N+X]=y*N+x;q.push([X,Y])}\n    }\n  }\n  let c=ty*N+tx;if(!(c in prev))return null;\n  while(prev[c]!==-1&&prev[prev[c]]!==-1)c=prev[c];\n  return [c%N,Math.floor(c/N)];\n}\nfunction thump(v){\n  if(!aud)return;\n  const o=aud.createOscillator(),gn=aud.createGain(),n=aud.currentTime;\n  o.frequency.setValueAtTime(70,n);o.frequency.exponentialRampToValueAtTime(35,n+.18);\n  gn.gain.setValueAtTime(v,n);gn.gain.exponentialRampToValueAtTime(.001,n+.25);\n  o.connect(gn).connect(aud.destination);o.start(n);o.stop(n+.3);\n}\nfunction toast(s){const t=$('toast');t.textContent=s;t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1800)}\nfunction end(win){\n  run=false;\n  if(!win){const f=$('flash');f.style.opacity=1;setTimeout(()=>f.style.opacity=0,350);thump(1);}\n  setTimeout(()=>{\n    $('ov').style.display='flex';\n    $('ov').querySelector('h1').textContent=win?'نجوتَ':'أمسك بك';\n    $('ov').querySelectorAll('p')[0].textContent=win?'خرجتَ إلى الهواء البارد. لكنك تسمع خطواته خلف الباب.':'كان أقرب مما ظننت. الظلام لا يرحم من يتوقف.';\n    $('go').textContent='حاول مرة أخرى';\n  },win?300:700);\n}\nfunction loop(now){\n  if(!run)return;\n  const dt=Math.min((now-last)/1000,.05);last=now;\n  // input\n  let dx=(held.ArrowRight||held.d?1:0)-(held.ArrowLeft||held.a?1:0),dy=(held.ArrowDown||held.s?1:0)-(held.ArrowUp||held.w?1:0);\n  if(joy){dx=joy.x;dy=joy.y}\n  const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}\n  const sp=3.1*dt,r=.28;\n  let nx=p.x+dx*sp,ny=p.y+dy*sp;\n  if(!solid(nx-r,p.y-r)&&!solid(nx+r,p.y-r)&&!solid(nx-r,p.y+r)&&!solid(nx+r,p.y+r))p.x=nx;\n  if(!solid(p.x-r,ny-r)&&!solid(p.x+r,ny-r)&&!solid(p.x-r,ny+r)&&!solid(p.x+r,ny+r))p.y=ny;\n  // keys\n  keys=keys.filter(k=>{if(Math.hypot(k.x-p.x,k.y-p.y)<.5){got++;$('k').textContent=got+'/3';thump(.9);toast(got<3?'مفتاح... وسمعتَ شيئًا يتحرك':'اذهب إلى الباب الأحمر');return false}return true});\n  // ghost\n  const active=now-t0>6000;\n  if(active){\n    const gs=(1.15+got*.45)*dt,nt=bfs(Math.floor(gh.x),Math.floor(gh.y),Math.floor(p.x),Math.floor(p.y));\n    if(nt){\n      const tx=nt[0]+.5,ty=nt[1]+.5,d=Math.hypot(tx-gh.x,ty-gh.y);\n      if(d>.001){gh.x+=(tx-gh.x)/d*Math.min(gs,d);gh.y+=(ty-gh.y)/d*Math.min(gs,d)}\n    }\n  }\n  const dist=Math.hypot(gh.x-p.x,gh.y-p.y);\n  if(active&&dist<.55&&alive){alive=false;end(false)}\n  // exit\n  if(p.x>13&&p.y>13){if(got===3&&alive){end(true)}else if(!held.warned){held.warned=1;toast('الباب مقفول');setTimeout(()=>held.warned=0,2500)}}\n  // heartbeat\n  beatT-=dt;\n  if(active&&dist<7&&beatT<=0){thump(Math.min(.9,1.1-dist/8));beatT=.35+dist*.1}\n  shake=dist<3&&active?(3-dist)*2.2:0;\n  draw(now,dist,active);\n  requestAnimationFrame(loop);\n}\nfunction draw(now,dist,active){\n  const W=cv.width;\n  cx.save();\n  cx.clearRect(0,0,W,W);\n  if(shake)cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);\n  for(let y=0;y<N;y++)for(let x=0;x<N;x++){\n    cx.fillStyle=g[y][x]?'#26302b':'#121314';\n    cx.fillRect(x*T,y*T,T+1,T+1);\n  }\n  // door\n  cx.fillStyle=got===3?'#cfc8b0':'#8a1218';cx.fillRect(13*T+T*.15,13*T+T*.15,T*.7,T*.7);\n  // keys\n  keys.forEach(k=>{cx.strokeStyle='#cfc8b0';cx.lineWidth=T*.09;cx.beginPath();cx.arc(k.x*T,k.y*T,T*.17,0,7);cx.stroke();cx.fillStyle='#cfc8b0';cx.fillRect(k.x*T+T*.15,k.y*T-T*.03,T*.2,T*.06)});\n  // ghost\n  if(active){\n    const a=Math.random()<.04?0:.9,gx=gh.x*T,gy=gh.y*T,s=T*.38;\n    cx.globalAlpha=a;cx.fillStyle='#d9d4c0';\n    cx.beginPath();cx.arc(gx,gy-s*.2,s,Math.PI,0);\n    for(let i=0;i<4;i++)cx.lineTo(gx+s-i*s/2,gy+s*.9+(i%2?-s*.3:s*.1));\n    cx.closePath();cx.fill();\n    cx.fillStyle='#000';cx.beginPath();cx.ellipse(gx-s*.38,gy-s*.3,s*.16,s*.26,0,0,7);cx.ellipse(gx+s*.38,gy-s*.3,s*.16,s*.26,0,0,7);cx.ellipse(gx,gy+s*.25,s*.17,s*.3,0,0,7);cx.fill();\n    cx.globalAlpha=1;\n  }\n  // player\n  cx.fillStyle='#e8e2c8';cx.beginPath();cx.arc(p.x*T,p.y*T,T*.22,0,7);cx.fill();\n  // darkness with flickering light\n  const fl=1+Math.sin(now/90)*.03+(Math.random()<.02?-.25:0),R=T*(3.1-(active&&dist<4?.6:0))*fl;\n  const gr=cx.createRadialGradient(p.x*T,p.y*T,T*.4,p.x*T,p.y*T,R);\n  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(.55,'rgba(0,0,0,.55)');gr.addColorStop(1,'rgba(0,0,0,.985)');\n  cx.fillStyle=gr;cx.fillRect(-20,-20,W+40,W+40);\n  if(active&&dist<3){cx.fillStyle='rgba(138,18,24,'+((3-dist)*.12)+')';cx.fillRect(0,0,W,W)}\n  cx.restore();\n}\n// controls\naddEventListener('keydown',e=>{held[e.key.length===1?e.key.toLowerCase():e.key]=1});\naddEventListener('keyup',e=>{held[e.key.length===1?e.key.toLowerCase():e.key]=0});\nlet o=null;\naddEventListener('pointerdown',e=>{if(e.target.tagName!=='BUTTON'){o={x:e.clientX,y:e.clientY};joy={x:0,y:0}}});\naddEventListener('pointermove',e=>{if(o){joy={x:Math.max(-1,Math.min(1,(e.clientX-o.x)/40)),y:Math.max(-1,Math.min(1,(e.clientY-o.y)/40))}}});\naddEventListener('pointerup',()=>{o=null;joy=null});\naddEventListener('pointercancel',()=>{o=null;joy=null});\n$('go').onclick=start;\n<\/script>\n<\/body>\n<\/html>\n", "f": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>مغامرة الثعلب<\/title>\n<style>\n:root{--sky:#7fd1f0;--ink:#1d2433;--fox:#e8742a;--paper:#fff6e0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml,body{height:100%;margin:0;background:var(--ink);color:var(--paper);font-family:Tahoma,\"Segoe UI\",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}\nbody{display:flex;flex-direction:column;align-items:center;justify-content:space-between}\n#hud{width:100%;max-width:720px;display:flex;justify-content:space-between;padding:10px 16px;box-sizing:border-box;font-size:18px;font-weight:700}\ncanvas{width:100%;max-width:720px;image-rendering:pixelated;background:var(--sky);border-top:4px solid var(--paper);border-bottom:4px solid var(--paper)}\n#pad{width:100%;max-width:720px;display:flex;justify-content:space-between;padding:14px 18px;box-sizing:border-box}\n#pad div{display:flex;gap:14px}\n#pad button{width:76px;height:76px;border-radius:50%;border:3px solid var(--paper);background:rgba(255,246,224,.12);color:var(--paper);font-size:30px;touch-action:none}\n#pad button.on{background:var(--fox)}\n#ov{position:fixed;inset:0;background:rgba(29,36,51,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}\n#ov h1{font-size:44px;margin:0;color:var(--fox)}\n#ov p{max-width:320px;line-height:1.9;font-size:18px;margin:0}\n#go{font:inherit;font-size:22px;font-weight:700;color:var(--ink);background:var(--fox);border:0;padding:12px 38px;border-radius:10px}\n#go:focus-visible,#pad button:focus-visible{outline:3px solid #fff}\n<\/style>\n<\/head>\n<body>\n<div id=\"hud\"><span>العملات: <span id=\"sc\">0<\/span><\/span><span id=\"lv\">❤ 3<\/span><\/div>\n<canvas id=\"c\" width=\"480\" height=\"288\"><\/canvas>\n<div id=\"pad\" dir=\"ltr\">\n  <div><button id=\"bl\" aria-label=\"يسار\">◀<\/button><button id=\"br\" aria-label=\"يمين\">▶<\/button><\/div>\n  <button id=\"bj\" aria-label=\"قفز\">▲<\/button>\n<\/div>\n<div id=\"ov\">\n  <h1>مغامرة الثعلب<\/h1>\n  <p>اقفز فوق الفجوات، واجمع العملات، واقفز على رؤوس الخنافس لتهزمها. وصِل إلى العلم في نهاية الطريق.<\/p>\n  <p style=\"font-size:15px;opacity:.7\">الأسهم أو A/D للحركة، ومسافة أو W للقفز<\/p>\n  <button id=\"go\">ابدأ<\/button>\n<\/div>\n<script>\nconst T=24,W=90,H=12,cv=document.getElementById('c'),cx=cv.getContext('2d'),$=id=>document.getElementById(id);\nlet t,coins,en,p,cam,score,lives,run,held={},aud;\nconst gaps=[[18,20],[40,42],[62,64]];\nconst plats=[[8,7,4],[14,6,3],[24,7,5],[30,5,3],[35,7,4],[46,7,3],[50,5,4],[56,7,3],[68,6,4],[74,4,3],[78,7,3]];\nfunction build(){\n  t=Array.from({length:H},()=>Array(W).fill(0));\n  for(let x=0;x<W;x++){if(gaps.some(g=>x>=g[0]&&x<=g[1]))continue;t[10][x]=1;t[11][x]=1}\n  plats.forEach(([x,y,w])=>{for(let i=0;i<w;i++)t[y][x+i]=2});\n  coins=[];\n  plats.forEach(([x,y,w])=>{for(let i=0;i<w;i++)coins.push({x:(x+i)*T+12,y:(y-1)*T+12,got:0})});\n  gaps.forEach(([a,b])=>{for(let i=0;i<=b-a;i++)coins.push({x:(a+i)*T+12,y:(8.2-Math.sin(i/(b-a)*Math.PI)*1.2)*T,got:0})});\n  en=[12,26,33,48,55,70,76].map(x=>({x:x*T,y:10*T-14,w:16,h:14,d:-1,dead:0}));\n}\nfunction reset(){p={x:2*T,y:8*T,w:14,h:20,vx:0,vy:0,g:0,f:1,inv:0};cam=0}\nfunction newGame(){build();reset();score=0;lives=3;run=true;$('sc').textContent=0;$('lv').textContent='❤ 3';$('ov').style.display='none';if(!aud)try{aud=new(window.AudioContext||window.webkitAudioContext)()}catch(e){};requestAnimationFrame(loop)}\nfunction tile(x,y){if(x<0||x>=W)return 1;if(y<0||y>=H)return 0;return t[y][x]}\nfunction hit(x,y,w,h){for(let yy=Math.floor(y/T);yy<=Math.floor((y+h-.01)/T);yy++)for(let xx=Math.floor(x/T);xx<=Math.floor((x+w-.01)/T);xx++)if(tile(xx,yy))return 1;return 0}\nfunction beep(f,d,ty){if(!aud)return;const o=aud.createOscillator(),g=aud.createGain(),n=aud.currentTime;o.type=ty||'square';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(f*1.6,n+d);g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(aud.destination);o.start(n);o.stop(n+d)}\nfunction die(){\n  lives--;$('lv').textContent='❤ '+lives;beep(160,.4,'sawtooth');\n  if(lives<=0){run=false;over('انتهت المحاولات','جمعتَ '+score+' عملة. جرّب مرة أخرى!','حاول مجددًا')}else reset();\n}\nfunction over(h,m,b){$('ov').style.display='flex';$('ov').querySelector('h1').textContent=h;$('ov').querySelector('p').textContent=m;$('go').textContent=b}\nfunction loop(){\n  if(!run)return;\n  const L=held.ArrowLeft||held.a||held.bl,R=held.ArrowRight||held.d||held.br,J=held.ArrowUp||held.w||held[' ']||held.bj;\n  p.vx=(R?1:0)*2.6-(L?1:0)*2.6;if(p.vx)p.f=p.vx>0?1:-1;\n  if(J&&p.g){p.vy=-9.6;p.g=0;beep(300,.15)}\n  if(!J&&p.vy<-3)p.vy=-3;\n  p.vy=Math.min(p.vy+.5,10);\n  p.x+=p.vx;\n  if(hit(p.x,p.y,p.w,p.h)){p.x=p.vx>0?Math.floor((p.x+p.w)/T)*T-p.w-.01:(Math.floor(p.x/T)+1)*T+.01}\n  p.y+=p.vy;p.g=0;\n  if(hit(p.x,p.y,p.w,p.h)){if(p.vy>0){p.y=Math.floor((p.y+p.h)/T)*T-p.h-.01;p.g=1}else p.y=(Math.floor(p.y/T)+1)*T+.01;p.vy=0}\n  if(p.y>H*T+40)die();\n  if(p.inv>0)p.inv--;\n  coins.forEach(c=>{if(!c.got&&Math.hypot(c.x-p.x-7,c.y-p.y-10)<14){c.got=1;score++;$('sc').textContent=score;beep(880,.12)}});\n  en.forEach(e=>{\n    if(e.dead)return;\n    e.x+=e.d*.7;\n    const fx=e.d>0?e.x+e.w+1:e.x-1;\n    if(tile(Math.floor(fx/T),Math.floor((e.y+6)/T))||!tile(Math.floor(fx/T),Math.floor((e.y+e.h+3)/T)))e.d*=-1;\n    if(p.x<e.x+e.w&&p.x+p.w>e.x&&p.y<e.y+e.h&&p.y+p.h>e.y){\n      if(p.vy>0&&p.y+p.h-e.y<14){e.dead=1;p.vy=-6;score+=2;$('sc').textContent=score;beep(520,.15)}\n      else if(!p.inv){die();p.inv=60}\n    }\n  });\n  if(p.x>86*T){run=false;beep(660,.5);over('وصلتَ!','أنهيتَ المرحلة بـ '+score+' عملة. أحسنت يا بطل.','العب مجددًا')}\n  cam=Math.max(0,Math.min(p.x-180,W*T-480));\n  draw();requestAnimationFrame(loop);\n}\nfunction draw(){\n  cx.clearRect(0,0,480,288);\n  cx.fillStyle='#bfeaf7';[[60,40],[200,60],[330,30]].forEach(([x,y])=>{const X=(x-cam*.3+600)%600-60;cx.fillRect(X,y,50,14);cx.fillRect(X+10,y-8,30,10)});\n  cx.save();cx.translate(-Math.floor(cam),0);\n  for(let y=0;y<H;y++)for(let x=Math.floor(cam/T);x<=Math.floor((cam+480)/T);x++){\n    const v=tile(x,y);if(!v||x>=W)continue;\n    if(v===1){cx.fillStyle='#8a5a33';cx.fillRect(x*T,y*T,T,T);if(y===10){cx.fillStyle='#4cae4c';cx.fillRect(x*T,y*T,T,6)}}\n    else{cx.fillStyle='#c4783c';cx.fillRect(x*T,y*T,T,T);cx.fillStyle='#8f4f22';cx.fillRect(x*T,y*T+11,T,2);cx.fillRect(x*T+11,y*T,2,11)}\n  }\n  const fr=Date.now()/180;\n  coins.forEach(c=>{if(c.got)return;const w=Math.abs(Math.sin(fr+c.x))*5+2;cx.fillStyle='#ffd23f';cx.fillRect(c.x-w,c.y-6,w*2,12)});\n  en.forEach(e=>{if(e.dead)return;cx.fillStyle='#6b3fa0';cx.fillRect(e.x,e.y+4,e.w,e.h-4);cx.fillRect(e.x+2,e.y,e.w-4,6);cx.fillStyle='#fff';cx.fillRect(e.x+3,e.y+5,4,4);cx.fillRect(e.x+9,e.y+5,4,4);cx.fillStyle='#000';cx.fillRect(e.x+4+(e.d>0?1:0),e.y+6,2,2);cx.fillRect(e.x+10+(e.d>0?1:0),e.y+6,2,2)});\n  cx.fillStyle='#fff';cx.fillRect(86*T,5*T,4,5*T);cx.fillStyle='#e03a3a';cx.fillRect(86*T+4,5*T,22,14);\n  if(!(p.inv&&Math.floor(Date.now()/80)%2)){\n    const x=Math.floor(p.x),y=Math.floor(p.y),s=p.f,leg=p.g&&p.vx?Math.floor(Date.now()/100)%2*2:0;\n    cx.fillStyle='#e8742a';cx.fillRect(x,y+6,14,10);cx.fillRect(x+1,y,12,8);\n    cx.fillRect(x+(s>0?-5:14),y+8,5,4);\n    cx.fillRect(x+1,y-4,3,5);cx.fillRect(x+10,y-4,3,5);\n    cx.fillStyle='#fff6e0';cx.fillRect(x+(s>0?7:2),y+3,5,4);cx.fillRect(x+4,y+10,6,6);\n    cx.fillStyle='#000';cx.fillRect(x+(s>0?9:3),y+3,2,2);\n    cx.fillStyle='#5a2f12';cx.fillRect(x+1,y+16,5,4-leg);cx.fillRect(x+8,y+16,5,4-(2-leg));\n  }\n  cx.restore();\n}\nconst map={ArrowLeft:1,ArrowRight:1,ArrowUp:1,' ':1};\naddEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;held[k]=1;if(map[e.key])e.preventDefault()});\naddEventListener('keyup',e=>{held[e.key.length===1?e.key.toLowerCase():e.key]=0});\n['bl','br','bj'].forEach(id=>{const b=$(id);\n  b.addEventListener('pointerdown',e=>{e.preventDefault();held[id]=1;b.classList.add('on')});\n  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{held[id]=0;b.classList.remove('on')}));\n});\n$('go').onclick=newGame;\n<\/script>\n<\/body>\n<\/html>\n", "p": "<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>سياسة الخصوصية<\/title>\n<style>\n:root{--bg:#fbf8f2;--ink:#1d2433;--accent:#8a1218;color-scheme:light dark}\n@media (prefers-color-scheme:dark){:root{--bg:#14161c;--ink:#ece7da;--accent:#e8574f}}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,\"Segoe UI\",sans-serif;line-height:2;padding:24px 18px 48px}\nmain{max-width:680px;margin:0 auto}\nh1{color:var(--accent);font-size:30px}\nh2{font-size:20px;margin-top:28px}\na{color:var(--accen
